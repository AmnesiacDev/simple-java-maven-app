services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile

    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/maven-app-db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy

    networks: 
      - maven-app-network

  postgres:
    image: postgres:16
    container_name: maven-postgres
    environment:
      POSTGRES_DB: maven-app-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres 
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
    networks:
      - maven-app-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: maven-nginx

    ports:
      - "80:80"

    depends_on:
      - app

    networks:
      - maven-app-network

networks:
  maven-app-network:
volumes:
  postgres-data:




